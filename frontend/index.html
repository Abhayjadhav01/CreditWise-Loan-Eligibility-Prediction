<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreditWise - Loan Eligibility Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CreditWise</h1>

        <p class="subtitle">
            AI-Powered Loan Eligibility Prediction
        </p>

        <form id="loanForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Applicant Income</label>
                    <input type="number" id="Applicant_Income" required>
                </div>

                <div class="form-group">
                    <label>Coapplicant Income</label>
                    <input type="number" id="Coapplicant_Income" required>
                </div>

                <div class="form-group">
                    <label>Employment Status</label>
                    <select id="Employment_Status" required>
                        <option value="">Select</option>
                        <option value="Salaried">Salaried</option>
                        <option value="Self-employed">Self-employed</option>
                        <option value="Unemployed">Unemployed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="Age" required>
                </div>

                <div class="form-group">
                    <label>Marital Status</label>
                    <select id="Marital_Status" required>
                        <option value="">Select</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dependents</label>
                    <input type="number" id="Dependents" required>
                </div>

                <div class="form-group">
                    <label>Credit Score</label>
                    <input type="number" id="Credit_Score" required>
                </div>

                <div class="form-group">
                    <label>Existing Loans</label>
                    <input type="number" id="Existing_Loans" required>
                </div>

                <div class="form-group">
                    <label>DTI Ratio</label>
                    <input type="number" id="DTI_Ratio" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Savings</label>
                    <input type="number" id="Savings" required>
                </div>

                <div class="form-group">
                    <label>Collateral Value</label>
                    <input type="number" id="Collateral_Value" required>
                </div>

                <div class="form-group">
                    <label>Loan Amount</label>
                    <input type="number" id="Loan_Amount" required>
                </div>

                <div class="form-group">
                    <label>Loan Term</label>
                    <input type="number" id="Loan_Term" required>
                </div>

                <div class="form-group">
                    <label>Loan Purpose</label>
                    <select id="Loan_Purpose" required>
                        <option value="">Select</option>
                        <option value="Home">Home</option>
                        <option value="Education">Education</option>
                        <option value="Business">Business</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Property Area</label>
                    <select id="Property_Area" required>
                        <option value="">Select</option>
                        <option value="Urban">Urban</option>
                        <option value="Semiurban">Semiurban</option>
                        <option value="Rural">Rural</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Education Level</label>
                    <select id="Education_Level" required>
                        <option value="">Select</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Not Graduate">Not Graduate</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="Gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Employer Category</label>
                    <select id="Employer_Category" required>
                        <option value="">Select</option>
                        <option value="Private">Private</option>
                        <option value="Government">Government</option>
                        <option value="Self-employed">Self-employed</option>
                    </select>
                </div>

            </div>

            <button type="submit">
                Check Loan Eligibility
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
